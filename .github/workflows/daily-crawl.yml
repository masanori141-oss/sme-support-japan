name: 毎日の補助金・融資・共済・民間ローンクローリング

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 金利の自動確認用ヘッドレスブラウザをインストール
        run: python -m playwright install --with-deps chromium

      - name: 金利の判定ルールのテスト（失敗したら以降を実行しない）
        run: python tests/test_rate_watch.py

      - name: 補助金・融資・共済のクローリングを実行
        run: python -m crawler.main

      - name: 民間金融機関の融資データを取得（政府系データと統合）
        run: python -m crawler.main_loans

      - name: 補助金台帳のサイト表示用データを生成
        run: python scripts/export_to_data_js.py

      - name: 融資・ローン比較台帳のサイト表示用データを生成
        run: python scripts/export_loans.py

      - name: 変更があればリポジトリにコミット
        run: |
          git config user.name "subsidy-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/subsidies.json data/loans.json data/rate_watch_state.json docs/data.js docs/data.json docs/sitemap.xml docs/llms.txt docs/loans/loan-data.js docs/loans/loan-data.json docs/loans/*.html
          git diff --quiet --cached || git commit -m "自動更新: $(date +'%Y-%m-%d') のクローリング結果"
          git push

      - name: 金利の自動確認で要対応があれば Issue を作成・更新
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/rate_watch_report.md ] || { echo "要対応なし"; exit 0; }
          gh label create loan-rate-check --color B93C28 --description "住宅ローン金利の自動確認で要対応" 2>/dev/null || true
          num=$(gh issue list --label loan-rate-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            # 前回と同じ内容なら追記しない（毎日同じ一覧が並ばないように）
            last=$(gh issue view "$num" --json body,comments --jq 'if (.comments|length)>0 then .comments[-1].body else .body end')
            if [ "$last" = "$(cat data/rate_watch_report.md)" ]; then echo "前回と同じ内容のため追記しません"; exit 0; fi
            gh issue comment "$num" --body-file data/rate_watch_report.md
          else
            gh issue create --title "【要確認】住宅ローン金利の自動確認" --label loan-rate-check --body-file data/rate_watch_report.md
          fi
