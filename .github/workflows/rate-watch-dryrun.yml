name: 住宅ローン金利の読み取りテスト（保存しない）

# 読み取り設定（crawler/fetch_private_loans.py の watch）を変えたときに、
# GitHub のサーバーから実際に読み取れるかを確認するための手動実行用ワークフロー。
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "対象を絞る文字列（例: みずほ）。空なら全件"
        required: false
        default: ""

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m crawler.rate_watch ${{ github.event.inputs.filter }}
